<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Animal island friends mobile wallpaper</title>
  <desc id="desc">A portrait animal-island wallpaper with village hills, a pond, trees, and small animal friends arranged for mobile screens.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9e3"/>
      <stop offset="0.58" stop-color="#f8f8f0"/>
      <stop offset="1" stop-color="#d6f0d4"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" x2="1" y1="0" y2="1">
