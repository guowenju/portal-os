    <rect x="-10" y="172" width="20" height="90" rx="10" fill="#9a835a"/>
  </g>

  <g transform="translate(900 410)" opacity="0.9">
    <path d="M-148 86c28-90 94-143 184-147 78-3 144 34 182 103 65 2 120 48 138 112H-220c12-32 36-56 72-68Z" fill="#f7f3df" stroke="#d8c9ad" stroke-width="8"/>
    <path d="M-116 84c44-58 106-82 186-72M78 12c42 12 76 39 102 82" fill="none" stroke="#bdaea0" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
