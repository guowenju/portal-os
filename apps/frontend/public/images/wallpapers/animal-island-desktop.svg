<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Animal island desktop wallpaper</title>
  <desc id="desc">A warm animal-island style desktop wallpaper with parchment sky, soft hills, trees, waves, and playful floating leaves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9e3"/>
      <stop offset="0.54" stop-color="#f8f8f0"/>
      <stop offset="1" stop-color="#d6f0d4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#98d2e3"/>
      <stop offset="0.55" stop-color="#82d5bb"/>
      <stop offset="1" stop-color="#327a93"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff5b8"/>
      <stop offset="0.74" stop-color="#f7cd67"/>
      <stop offset="1" stop-color="#f7cd67" stop-opacity="0"/>
    </radialGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="28"/>
      <feColorMatrix type="saturate" values="0.35"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="leafDots" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M24 24c18-16 36-12 47 6-18 16-36 14-47-6Z" fill="#19c8b9" opacity="0.08"/>
      <path d="M62 68c12-14 26-14 38-2-12 13-27 14-38 2Z" fill="#6fba2c" opacity="0.08"/>
      <circle cx="18" cy="72" r="4" fill="#f7cd67" opacity="0.14"/>
    </pattern>
    <path id="tree" d="M0 0c-34 0-61 28-61 62 0 24 14 45 34 55-4 9-6 18-6 28 0 36 29 65 65 65s65-29 65-65c0-12-3-24-9-34 16-12 26-31 26-52 0-36-29-65-65-65-13 0-25 4-35 10A61 61 0 0 0 0 0Z"/>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)" filter="url(#paperNoise)"/>
  <rect width="1920" height="1080" fill="url(#leafDots)"/>
  <circle cx="1540" cy="172" r="166" fill="url(#sun)" opacity="0.82"/>

  <g opacity="0.68">
    <path d="M-40 640c198-134 396-176 594-126 134 34 258 99 402 86 156-14 282-118 456-124 178-6 342 82 548 210v394H-40Z" fill="#bde5bb"/>
