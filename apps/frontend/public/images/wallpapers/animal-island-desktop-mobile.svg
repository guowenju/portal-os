<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Animal island mobile wallpaper</title>
  <desc id="desc">A portrait animal-island wallpaper with parchment sky, soft hills, trees, waves, and floating leaves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9e3"/>
      <stop offset="0.54" stop-color="#f8f8f0"/>
      <stop offset="1" stop-color="#d6f0d4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#98d2e3"/>
      <stop offset="0.55" stop-color="#82d5bb"/>
      <stop offset="1" stop-color="#327a93"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="28"/>
      <feColorMatrix type="saturate" values="0.35"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="leafDots" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M24 24c18-16 36-12 47 6-18 16-36 14-47-6Z" fill="#19c8b9" opacity="0.08"/>
      <path d="M62 68c12-14 26-14 38-2-12 13-27 14-38 2Z" fill="#6fba2c" opacity="0.08"/>
      <circle cx="18" cy="72" r="4" fill="#f7cd67" opacity="0.14"/>
    </pattern>
