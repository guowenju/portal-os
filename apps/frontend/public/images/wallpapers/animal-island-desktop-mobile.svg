  </defs>
  <rect width="1080" height="1920" fill="url(#sky)" filter="url(#paperNoise)"/>
  <rect width="1080" height="1920" fill="url(#leafDots)"/>
  <circle cx="820" cy="236" r="150" fill="#f7cd67" opacity="0.48"/>
  <g opacity="0.7">
    <path d="M-50 1054c144-118 294-154 450-108 104 31 202 88 316 72 130-18 234-102 370-74v976H-50Z" fill="#bde5bb"/>
