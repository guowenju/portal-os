[workspace]
resolver = "2"
members = [
    "apps/backend",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["Wenju Guo"]

[workspace.dependencies]
serde = { version = "1" }
serde_json = { version = "1" }
chrono = { version = "0.4" }
axum = { version = "0.8.7" }
tower-http = { version = "0.6.6" }
tokio = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
shadow-rs = { version = "1.4.0" }
anyhow = { version = "1.0.100" }
rust-embed = { version = "8.4.0" }
mime_guess = { version = "2.0.4" }
clap = { version = "4" }
reqwest = { version = "0.12", default-features = false }

[profile.release]
strip = true
lto = "fat"

[profile.dev]
incremental = true
