services:
  portal-os:
    image: guowenju/portal-os:latest
    container_name: portal-os
    restart: unless-stopped
    environment:
      RUST_LOG: info
      PORTAL_OS_DATA_DIR: /app/data
      PORTAL_OS_ADMIN_USERNAME: ${PORTAL_OS_ADMIN_USERNAME:?请设置管理员用户名}
      PORTAL_OS_ADMIN_PASSWORD: ${PORTAL_OS_ADMIN_PASSWORD:?请设置至少 12 位的管理员密码}
    ports:
      - '9090:9090'
    volumes:
      - ./data:/app/data
