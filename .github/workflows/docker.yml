name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Whether this is a prerelease
        required: false
        default: false
        type: boolean

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_id="$(cargo pkgid -p portal-os)"
          cargo_version="${package_id##*#}"
          cargo_version="${cargo_version##*@}"
          if [ -z "$cargo_version" ]; then
            echo "Unable to read portal-os version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="${{ secrets.DOCKERHUB_USERNAME }}/portal-os"
          tags=("${image}:${{ steps.version.outputs.version }}")
          if [ "${{ inputs.prerelease }}" = "false" ]; then
            tags+=("${image}:latest")
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=portal-os-docker
          cache-to: type=gha,mode=max,scope=portal-os-docker

      - name: Sync Docker Hub README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.meta.outputs.image }}
          readme-filepath: README.md
