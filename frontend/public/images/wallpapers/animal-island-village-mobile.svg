<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Animal island village mobile wallpaper</title>
  <desc id="desc">A portrait animal-island village wallpaper with soft clay houses, warm lanterns, trees, and an ocean footer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset="0.55" stop-color="#f7f3df"/>
      <stop offset="1" stop-color="#cbe9c8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#98d2e3"/>
      <stop offset="1" stop-color="#327a93"/>
    </linearGradient>
    <filter id="paperNoise">
