<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Animal island village wallpaper</title>
  <desc id="desc">A cozy animal-island village wallpaper with soft clay houses, warm lanterns, trees, and an ocean footer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset="0.55" stop-color="#f7f3df"/>
      <stop offset="1" stop-color="#cbe9c8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#98d2e3"/>
      <stop offset="1" stop-color="#327a93"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="86"/>
      <feColorMatrix type="saturate" values="0.34"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
