<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Animal island friends wallpaper</title>
  <desc id="desc">A warm animal-island style wallpaper with a small cat, dog, rabbit, duck, trees, flowers, and rounded village hills.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9e3"/>
      <stop offset="0.6" stop-color="#f8f8f0"/>
      <stop offset="1" stop-color="#d6f0d4"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#98d2e3"/>
      <stop offset="0.58" stop-color="#82d5bb"/>
      <stop offset="1" stop-color="#327a93"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="118"/>
      <feColorMatrix type="saturate" values="0.36"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="petals" width="132" height="132" patternUnits="userSpaceOnUse">
      <path d="M34 28c20-15 40-10 52 8-20 16-40 12-52-8Z" fill="#19c8b9" opacity="0.08"/>
      <circle cx="102" cy="88" r="5" fill="#f7cd67" opacity="0.16"/>
      <circle cx="28" cy="100" r="4" fill="#f8a6b2" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)" filter="url(#paperNoise)"/>
  <rect width="1920" height="1080" fill="url(#petals)"/>
  <circle cx="1536" cy="172" r="150" fill="#f7cd67" opacity="0.48"/>

